<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZProject API</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; max-width: 560px; width: 90%; }
      h1 { color: #60a5fa; margin: 0 0 1rem; font-size: 1.5rem; }
      p { color: #94a3b8; margin: 0 0 1.5rem; line-height: 1.6; }
      code { background: #334155; padding: 0.2em 0.4em; border-radius: 4px; color: #60a5fa; font-size: 0.875rem; }
      .badge { display: inline-block; background: #1d4ed8; color: white; padding: 0.25em 0.75em; border-radius: 999px; font-size: 0.75rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EZProject API</h1>
      <p>Backend server is running. API endpoints are available at <code>/api/v1</code>.</p>
      <div>
        <span class="badge">Express</span>
        <span class="badge">MongoDB</span>
        <span class="badge">Mongoose</span>
        <span class="badge">JWT</span>
      </div>
    </div>
  </body>
</html>
